

# ──────────────────────────────────────────────────────────────────────────
# MHBAP — Multimodal Human Behaviour Analysis Platform
# docker-compose up --build
# ──────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: mhbap
      POSTGRES_PASSWORD: mhbp2625
      POSTGRES_DB: mhbap
    ports:
     - "5432:5432"
    volumes:
       - postgres_data:/var/lib/postgresql/data
       - ./init_timescale.sql:/docker-entrypoint-initdb.d/init_timescale.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mhbap"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (stream bus) ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ───────────────────────────────────────────────────────
  backend:
    build:
      # Context is the repo root so pyproject.toml is reachable during the
      # builder stage. The Dockerfile path is explicit because the context
      # is no longer the same directory as the Dockerfile.
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://mhbap:mhbp2625@postgres:5432/mhbap
      DATABASE_SYNC_URL: postgresql://mhbap:mhbp2625@postgres:5432/mhbap
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-changeme_in_production}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── React frontend (nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
