[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhbap"
version = "0.1.0"
description = "Multimodal Human Behavior Analysis Platform"
authors = [{ name = "MHBAP Research Team" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
keywords = ["affective-computing", "multimodal", "emotion", "engagement", "XAI"]

dependencies = [
    # Web
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    # DB
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "psycopg2-binary>=2.9.9",
    # Config / validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",
    "python-dotenv>=1.0.0",
    # Utilities
    "loguru>=0.7.2",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
ml = [
    # Vision
    "opencv-python>=4.10.0",
    "mediapipe>=0.10.14",
    "Pillow>=10.3.0",
    # Deep learning
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "timm>=1.0.3",
    "transformers>=4.42.0",
    # Audio
    "sounddevice>=0.4.7",
    "librosa>=0.10.2",
    "opensmile>=2.5.0",
    # HCI
    "pynput>=1.7.7",
    # XAI
    "shap>=0.45.0",
    "grad-cam>=1.5.0",
    # Data science
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "ipython>=8.12.0,<8.13; python_version < '3.10'",
    "ipython>=8.25.0; python_version >= '3.10'",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[project.scripts]
mhbap = "scripts.cli:app"

[tool.setuptools.packages.find]
include = ["backend*", "ml*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests", "ml/tests"]
addopts = "-v --cov=backend --cov=ml --cov-report=term-missing"
