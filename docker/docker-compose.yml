version: "3.9"

services:

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: mhbap_db
    environment:
      POSTGRES_USER: mhbap
      POSTGRES_PASSWORD: mhbap2625
      POSTGRES_DB: mhbap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_timescale.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mhbap"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mhbap_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: mhbap_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - DATABASE_SYNC_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL= redis://redis:6379/0
      - APP_ENV=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../ml/models/weights:/app/ml/models/weights

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: mhbap_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
