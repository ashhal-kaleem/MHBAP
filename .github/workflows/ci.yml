name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  # ── Backend: unit tests + coverage ────────────────────────────────────────
  backend:
    name: Backend (Python 3.9)
    runs-on: ubuntu-latest
    # No working-directory default — install and pytest both run from repo root
    # so that pyproject.toml is found and its paths (backend/, ml/) resolve.

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          # Point the pip cache key at pyproject.toml (no requirements.txt exists)
          cache-dependency-path: pyproject.toml

      - name: Install uv
        run: pip install uv

      - name: Install deps
        # Install from the existing uv.lock
        run: uv sync --extra dev

      - name: Ruff lint (advisory)
        # Path is now relative to repo root, not backend/
        run: ruff check backend/app/ || true

      - name: Unit tests + coverage
        run: |
          uv run python -m pytest backend/tests/unit/ -v \
            --tb=short \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          # coverage.xml is now written at repo root (pytest runs from root)
          file: coverage.xml
          flags: backend
        continue-on-error: true

  # ── Frontend: TypeScript check + production build ──────────────────────────
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  # ── Docker smoke test (runs after both pass) ───────────────────────────────
  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo docker system prune -af
          df -h

      - name: Debug ml/ presence
        run: |
          echo "=== Git commit ==="
          git rev-parse HEAD
          echo "=== ml/ directory exists? ==="
          ls -la ml/ || echo "NOT FOUND"
          echo "=== First 10 files in ml/ ==="
          find ml/ -maxdepth 2 -type f | head -10 || echo "NONE"
          echo "=== git ls-files ml ==="
          git ls-files ml
          echo "=== Dockerfile lines around COPY ml/ ==="
          grep -n "ml/" backend/Dockerfile | head -20

      - name: Build backend image
        run: docker build -t mhbap-backend:ci -f backend/Dockerfile .

      - name: Build frontend image
        run: docker build -t mhbap-frontend:ci ./frontend
